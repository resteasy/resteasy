# Labels and drafts pull requests which require a snapshot build of the Jakarta REST API.
#
# A PR opts in with an "Implements jakartaee/rest#1234" line in its description, or by a maintainer
# adding the label. Either way it is converted to a draft, because it cannot build against a
# released API and must not be merged until that API is released. Drafts cannot be merged, which
# makes this a hard block rather than a status check that can be overridden. Removing the label and
# marking the PR ready for review again are both left to a human.
#
# This uses pull_request_target so that PRs from forks also get a token which can write to the PR.
# The job deliberately checks out nothing and runs no code from the PR.

name: Draft Spec Snapshot PRs

on:
  pull_request_target:
    types: [opened, reopened, edited, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  draft-spec-snapshot-pr:
    if: >-
      ${{ contains(github.event.pull_request.labels.*.name, 'requires-spec-snapshot')
          || contains(github.event.pull_request.body, 'implements jakartaee/rest#') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LABEL: requires-spec-snapshot
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Add the label
        id: label
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'requires-spec-snapshot') }}
        run: gh pr edit "$PR" --repo "$REPO" --add-label "$LABEL"

      - name: Convert the PR to a draft
        if: ${{ !github.event.pull_request.draft }}
        run: gh pr ready --undo "$PR" --repo "$REPO"

      # Only when the label is first applied, either by the step above or by a maintainer, so this
      # is not repeated every time the description is edited.
      - name: Explain why the PR was drafted
        if: ${{ steps.label.outcome == 'success' || github.event.action == 'labeled' }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body \
          "This pull request is labeled \`$LABEL\` and has been converted to a draft, because it
          builds against an unreleased version of the Jakarta REST API. It cannot be merged until
          that API is released and the label is removed.

          While the label is present it is tested against a snapshot of the API instead of the
          usual builds. See
          [Changes Requiring an Unreleased Jakarta REST API](../blob/main/README.adoc#changes-requiring-an-unreleased-jakarta-rest-api)
          for how to choose which version of the specification is used."
