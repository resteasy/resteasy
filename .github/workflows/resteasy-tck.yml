# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Jakarta REST TCK - 6.2

on:
  push:
    branches:
      - '6.2'
    paths:
      - 'pom.xml'
      - 'providers/**'
      - 'resteasy-bom/**'
      - 'resteasy-cdi/**'
      - 'resteasy-client/**'
      - 'resteasy-client-api/**'
      - 'resteasy-client-utils/**'
      - 'resteasy-core/**'
      - 'resteasy-core-spi/**'
      - 'resteasy-dependencies-bom/**'
      - 'security/**'
      - 'server-adapters/resteasy-undertow-cdi/**'
      - 'wildfly/**'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/resteasy-tck.yml'
      - 'pom.xml'
      - 'providers/**'
      - 'resteasy-bom/**'
      - 'resteasy-cdi/**'
      - 'resteasy-client/**'
      - 'resteasy-client-api/**'
      - 'resteasy-client-utils/**'
      - 'resteasy-core/**'
      - 'resteasy-core-spi/**'
      - 'resteasy-dependencies-bom/**'
      - 'security/**'
      - 'server-adapters/resteasy-undertow-cdi/**'
      - 'wildfly/**'

  workflow_call:
    inputs:
      resteasy-ref:
        description: "RESTEasy branch, tag, or commit to build"
        required: true
        type: string

# Only run the latest job
concurrency:
  group: '${{ github.workflow }} @ ${{ inputs.resteasy-ref || github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  MVN_ARGS: '-V -B -fae'

jobs:
  run-tck:

    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout RESTEasy
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.resteasy-ref || github.sha }}
          path: resteasy
      - name: Checkout RESTEasy TCK Runner
        uses: actions/checkout@v7
        with:
          repository: resteasy/resteasy-tck-runner
          path: resteasy-tck-runner
          ref: 'jakarta-rest-3.1'
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          cache: 'maven'
          # Please note the order here of having 25 last as that is the version we want to compile with
          java-version: |
            17
            21
            25
      - name: Build RESTEasy
        id: resteasy-build
        run:  |
          cd resteasy
          ./mvnw ${{ env.MVN_ARGS }} clean install -DskipTests
          RESTEASY_VERSION="$(mvn -B help:evaluate -Dexpression=project.version -DforceStdout -q)"
          echo "RESTEASY_VERSION=$RESTEASY_VERSION"
          echo "RESTEASY_VERSION=$RESTEASY_VERSION" >> "$GITHUB_OUTPUT"
      - name: Run the Jakarta REST TCK - Java 25
        run:  |
          echo "RESTEASY_VERSION=${{ steps.resteasy-build.outputs.RESTEASY_VERSION }}"
          cd resteasy-tck-runner
          mvn ${{ env.MVN_ARGS }} clean verify -Dtck.log.debug=true -Dversion.org.jboss.resteasy="${{ steps.resteasy-build.outputs.RESTEASY_VERSION }}"
      - name: Run the Jakarta REST TCK - Java 21
        run:  |
          echo "RESTEASY_VERSION=${{ steps.resteasy-build.outputs.RESTEASY_VERSION }}"
          cd resteasy-tck-runner/resteasy-tck-adapter
          mvn ${{ env.MVN_ARGS }} verify -Dtck.log.debug=true -Dversion.org.jboss.resteasy="${{ steps.resteasy-build.outputs.RESTEASY_VERSION }}" -Djvm="${{env.JAVA_HOME_21_X64}}/bin/java"
      - name: Run the Jakarta REST TCK - Java 17
        run:  |
          echo "RESTEASY_VERSION=${{ steps.resteasy-build.outputs.RESTEASY_VERSION }}"
          cd resteasy-tck-runner/resteasy-tck-adapter
          mvn ${{ env.MVN_ARGS }} verify -Dtck.log.debug=true -Dversion.org.jboss.resteasy="${{ steps.resteasy-build.outputs.RESTEASY_VERSION }}" -Djvm="${{env.JAVA_HOME_17_X64}}/bin/java"
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-report
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
            **/*.log

  legacy-run-tck:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout RESTEasy
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.resteasy-ref || github.sha }}
          path: resteasy
      - name: Checkout RESTEasy TCK Runner
        uses: actions/checkout@v7
        with:
          repository: resteasy/resteasy-tck-runner
          path: resteasy-tck-runner
          ref: 'jakarta-rest-3.1'
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          cache: 'maven'
          java-version: 11
      - name: Build RESTEasy
        id: resteasy-build
        run:  |
          cd resteasy
          mvn ${{ env.MVN_ARGS }} clean install -DskipTests
          RESTEASY_VERSION="$(mvn -B help:evaluate -Dexpression=project.version -DforceStdout -q)"
          echo "RESTEASY_VERSION=$RESTEASY_VERSION"
          echo "RESTEASY_VERSION=$RESTEASY_VERSION" >> "$GITHUB_OUTPUT"
      - name: Run the Jakarta REST TCK - JDK 11
        run:  |
          echo "RESTEASY_VERSION=${{ steps.resteasy-build.outputs.RESTEASY_VERSION }}"
          cd resteasy-tck-runner
          mvn ${{ env.MVN_ARGS }} clean verify -Dtck.log.debug=true -Dversion.org.jboss.resteasy="${{ steps.resteasy-build.outputs.RESTEASY_VERSION }}" -Dversion.org.wildfly=34.0.1.Final -Plegacy-wildfly-channels -Dwildfly.channel.manifest.artifactId=wildfly-ee -Dserver.test.feature.pack.artifactId=wildfly-ee-galleon-pack
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: legacy-failure-report
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
            **/*.log
