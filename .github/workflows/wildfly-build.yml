# This workflow is for a nightly run against WildFly upstream

name: WildFly Test Build

on:
  push:
    branches:
      - 'main'
    paths:
      - 'pom.xml'
      - 'providers/**'
      - 'resteasy-bom/**'
      - 'resteasy-cdi/**'
      - 'resteasy-client/**'
      - 'resteasy-client-api/**'
      - 'resteasy-client-utils/**'
      - 'resteasy-core/**'
      - 'resteasy-core-spi/**'
      - 'resteasy-dependencies-bom/**'
      - 'testsuite/arquillian-utils/**'
      - 'testsuite/integration-tests/**'
      - 'wildfly/**'
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - '.github/workflows/wildfly-build.yml'
      - 'testsuite/integration-tests/**'
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC

# Only run the latest job and cancel previous ones
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

env:
  MVN_ARGS: '-V -B -fae'

jobs:

  resteasy-build:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'requires-spec-snapshot') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: wildfly-extras/wildfly-nightly-download@v2
        id: wildfly-nightly
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          cache: 'maven'
          # Please note the order here of having 25 last as that is the version we want to compile with
          java-version: |
            21
            27
            25
      - name: Build RESTEasy
        run: |
          ./mvnw ${{ env.MVN_ARGS }} clean install -DskipTests '-Dserver.version=${{steps.wildfly-nightly.outputs.wildfly-version}}'
      - name: Test on ${{ matrix.os }} WildFly ${{steps.wildfly-nightly.outputs.wildfly-version}} - Java 25
        run: |
          cd testsuite/integration-tests
          mvn ${{ env.MVN_ARGS }} verify '-Dserver.version=${{steps.wildfly-nightly.outputs.wildfly-version}}'
      - name: Test on ${{ matrix.os }} WildFly ${{steps.wildfly-nightly.outputs.wildfly-version}} - Java 27
        run:  |
          cd testsuite/integration-tests
          mvn ${{ env.MVN_ARGS }} verify '-Dtest.java.home=${{env.JAVA_HOME_27_X64}}${{env.JAVA_HOME_27_ARM64}}' '-Dserver.version=${{steps.wildfly-nightly.outputs.wildfly-version}}' '-Dtest.report.dir=java27'
      - name: Test on ${{ matrix.os }} WildFly ${{steps.wildfly-nightly.outputs.wildfly-version}} - Java 21
        run:  |
          cd testsuite/integration-tests
          mvn ${{ env.MVN_ARGS }} verify '-Dtest.java.home=${{env.JAVA_HOME_21_X64}}${{env.JAVA_HOME_21_ARM64}}' '-Dserver.version=${{steps.wildfly-nightly.outputs.wildfly-version}}' '-Dtest.report.dir=java21'
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-report-${{ matrix.os }}
          path: |
            **/failsafe-reports/**
            **/surefire-reports/**
            **/*.log

  additional-profiles:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'requires-spec-snapshot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile:
          - '-Pprovision-without-resteasy'

    steps:
      - uses: actions/checkout@v7
      - uses: wildfly-extras/wildfly-nightly-download@v2
        id: wildfly-nightly
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          cache: 'maven'
          java-version: |
            21
            25
      - name: Build RESTEasy
        run: |
          ./mvnw ${{ env.MVN_ARGS }} clean install -DskipTests '-Dserver.version=${{steps.wildfly-nightly.outputs.wildfly-version}}'
      - name: Test with WildFly ${{steps.wildfly-nightly.outputs.wildfly-version}} - Java 25
        run:  |
          cd testsuite/integration-tests
          mvn ${{ env.MVN_ARGS }} verify ${{ matrix.profile }} '-Dserver.version=${{steps.wildfly-nightly.outputs.wildfly-version}}'
      - name: Test with WildFly ${{steps.wildfly-nightly.outputs.wildfly-version}} - Java 21
        run:  |
          cd testsuite/integration-tests
          mvn ${{ env.MVN_ARGS }} verify ${{ matrix.profile }} '-Dserver.version=${{steps.wildfly-nightly.outputs.wildfly-version}}' '-Dtest.java.home=${{env.JAVA_HOME_21_X64}}${{env.JAVA_HOME_21_ARM64}}' '-Dtest.report.dir=java21'
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-report
          path: |
            **/failsafe-reports/**
            **/surefire-reports/**
            **/*.log
