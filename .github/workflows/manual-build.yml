# This workflow is for a nightly run against WildFly upstream

name: Manual RESTEasy Build

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner OS"
        required: true
        default: "ubuntu-latest"
        type: string
      javaVersion:
        description: "Java Version"
        required: true
        default: "17"
        type: string

env:
  MVN_ARGS: '-V -B'

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ inputs.javaVersion }}
        uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ inputs.javaVersion }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
      - name: Build on ${{ inputs.os }} with Java ${{ inputs.javaVersion }}
        run: ./mvnw ${{ env.MVN_ARGS }} clean install '-Dtest.java.home=${{ env[format('JAVA_HOME_{0}_X64', inputs.javaVersion)] }}'
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-report
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
            **/*.log
